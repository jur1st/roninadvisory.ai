<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1430" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 700; fill: #111827; }
    .subtitle { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #4b5563; }
    .sec { font-size: 19px; font-weight: 700; fill: #111827; }
    .boxttl { font-size: 16px; font-weight: 700; fill: #111827; }
    .boxsub { font-size: 13px; fill: #374151; }
    .small { font-size: 12px; fill: #4b5563; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .conn { stroke: #6b7280; stroke-width: 2; fill: none; }
    .connlbl { font-size: 11.5px; fill: #6b7280; font-style: italic; }
    .valid { fill: #f4f7f6; stroke: #1f2937; stroke-width: 2.2; }
    .present { fill: #eef4ff; stroke: #1e3a8a; stroke-width: 2.6; }
    .node { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
    .revbox { fill: #fafafa; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 1 4; }
    .void { fill: #fdf2f2; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 7 5; }
    .voidttl { font-size: 14px; font-weight: 700; fill: #b91c1c; text-decoration: line-through; }
    .voidtxt { font-size: 12px; fill: #b91c1c; }
    .teal { fill: #0f766e; }
    .tealbox { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1.8; }
    .tealtxt { font-size: 12.5px; fill: #0f766e; font-weight: 600; }
    .axis { stroke: #374151; stroke-width: 2; }
    .tick { stroke: #9ca3af; stroke-width: 1; }
    .window { stroke: #b45309; stroke-width: 3; }
    .windowcap { stroke: #b45309; stroke-width: 2; }
    .deathdot { fill: #7c2d12; }
    .winlbl { font-size: 12px; fill: #92400e; font-weight: 600; }
    .vest { fill: #6d28d9; }
    .vestlbl { font-size: 11.5px; fill: #5b21b6; }
    .boundary { stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 6 4; }
    .beyond { fill: #fde8e8; opacity: 0.55; }
    .legbox { fill: #fcfcfc; stroke: #d1d5db; stroke-width: 1.4; }
  </style>

  <rect class="bg" x="0" y="0" width="1400" height="1430"/>
  <rect x="8" y="8" width="1384" height="1414" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

  <text class="title" x="36" y="46">Article IV &#8212; Interests in Blackacre &amp; Rule Against Perpetuities</text>
  <text class="subtitle" x="36" y="70">In re Estate of Helena Cartwright &#183; State of Franklin (fee tail retained; classical RAP; no wait-and-see)</text>
  <line x1="36" y1="84" x2="1364" y2="84" stroke="#111827" stroke-width="1.2"/>

  <!-- ================= SECTION A: CHAIN OF INTERESTS ================= -->
  <text class="sec" x="36" y="118">A.  Chain of Interests</text>

  <!-- Helena node -->
  <rect class="node" x="120" y="134" width="470" height="40" rx="6"/>
  <text class="boxttl" x="355" y="159" text-anchor="middle">HELENA (testator) &#8212; devises Blackacre, d. 3/1/2024</text>

  <!-- connector -->
  <line class="conn" x1="355" y1="174" x2="355" y2="196" marker-end="url(#arrow)"/>

  <!-- Arthur fee tail -->
  <rect class="present" x="120" y="196" width="470" height="78" rx="8"/>
  <text class="boxttl" x="140" y="224">1.  ARTHUR  &#8212;  FEE TAIL</text>
  <text class="boxsub" x="140" y="246">Present possessory estate of inheritance.</text>
  <text class="small" x="140" y="265">Descends to heirs of his body; barrable by disentailing.</text>

  <line class="conn" x1="355" y1="274" x2="355" y2="306" marker-end="url(#arrow)"/>
  <text class="connlbl" x="368" y="294">on failure of bodily line (indefinite failure of issue) &#8212; the natural end of the fee tail</text>

  <!-- Widow life estate -->
  <rect class="valid" x="120" y="306" width="470" height="80" rx="8"/>
  <text class="boxttl" x="140" y="334">2.  ARTHUR&#8217;S WIDOW (unascertained) &#8212; LIFE ESTATE</text>
  <text class="boxsub" x="140" y="356">Contingent remainder (taker unknown until Arthur&#8217;s death).</text>
  <text class="small" x="140" y="375">VALID &#8212; vests or fails at Arthur&#8217;s death (a life in being).</text>

  <line class="conn" x1="355" y1="386" x2="355" y2="408" marker-end="url(#arrow)"/>

  <!-- Grandchildren -->
  <rect class="valid" x="120" y="408" width="470" height="92" rx="8"/>
  <text class="boxttl" x="140" y="436">3.  GRANDCHILDREN who attain 25 &#8212; CR in FEE</text>
  <text class="boxsub" x="140" y="458">Contingent remainder; class gift, subject to open.</text>
  <text class="small" x="140" y="476">Share vests at age 25 and is transmissible (need not</text>
  <text class="small" x="140" y="492">survive the line&#8217;s failure). Alternative with #4.</text>

  <line class="conn" x1="355" y1="500" x2="355" y2="522" marker-end="url(#arrow)"/>
  <text class="connlbl" x="368" y="516">alternative: if no grandchild ever attains 25</text>

  <!-- Society -->
  <rect class="valid" x="120" y="522" width="470" height="78" rx="8"/>
  <text class="boxttl" x="140" y="550">4.  RENSSELAER HISTORICAL SOCIETY &#8212; CR in FEE</text>
  <text class="boxsub" x="140" y="572">Alternative contingent remainder (charity).</text>
  <text class="small" x="140" y="591">Takes only if no grandchild attains 25.</text>

  <line class="conn" x1="355" y1="600" x2="355" y2="622" marker-end="url(#arrow)"/>

  <!-- Reversion -->
  <rect class="revbox" x="120" y="622" width="470" height="58" rx="8"/>
  <text class="boxttl" x="140" y="648">5.  HELENA&#8217;S ESTATE &#8594; ARTHUR (residue) &#8212; REVERSION</text>
  <text class="small" x="140" y="669">Fee-simple backstop pending vesting of the remainders.</text>

  <!-- ===== VOID-BUT-FOR ghosts + fee-tail rescue ===== -->
  <text class="tealtxt" x="640" y="424" font-size="13.5px">Under classical RAP these two would be:</text>

  <!-- Grandchildren ghost -->
  <rect class="void" x="640" y="436" width="510" height="76" rx="8"/>
  <text class="voidttl" x="660" y="462">#3 GRANDCHILDREN &#8212; VOID for remoteness</text>
  <line x1="660" y1="457" x2="1010" y2="457" stroke="#b91c1c" stroke-width="1.4"/>
  <text class="voidtxt" x="660" y="482">Fertile-ancestor trap: afterborn child of Arthur (not a</text>
  <text class="voidtxt" x="660" y="499">life in being) may bear a grandchild reaching 25 &gt; 21 yrs out;</text>

  <!-- Society ghost -->
  <rect class="void" x="640" y="524" width="510" height="76" rx="8"/>
  <text class="voidttl" x="660" y="550">#4 SOCIETY &#8212; VOID for remoteness</text>
  <line x1="660" y1="545" x2="965" y2="545" stroke="#b91c1c" stroke-width="1.4"/>
  <text class="voidtxt" x="660" y="570">Follows a PRIVATE interest, so no charity-to-charity</text>
  <text class="voidtxt" x="660" y="587">exception; also the unborn-widow trap (see panel B).</text>

  <!-- rescue arrows from ghost back to solid -->
  <path class="conn" d="M 640 474 C 612 474 612 454 592 452" stroke="#0f766e" stroke-width="2.4" marker-end="url(#tealarrow)"/>
  <path class="conn" d="M 640 562 C 612 562 612 562 592 561" stroke="#0f766e" stroke-width="2.4" marker-end="url(#tealarrow)"/>

  <!-- fee-tail exemption banner -->
  <rect class="tealbox" x="640" y="614" width="510" height="66" rx="8"/>
  <text class="tealtxt" x="660" y="638" font-size="14px" font-weight="700">&#8592; RESCUED BY THE FEE TAIL</text>
  <text class="tealtxt" x="660" y="658" font-weight="400">A remainder after a fee tail is outside the Rule entirely:</text>
  <text class="tealtxt" x="660" y="674" font-weight="400">the tenant in tail may bar the entail &amp; destroy them all.</text>

  <text class="tiny" x="640" y="406">Solid border = valid as held.  Dashed red + strike-through = void under straight RAP.</text>

  <!-- ================= SECTION B: TIMELINE ================= -->
  <text class="sec" x="36" y="744">B.  RAP Timeline &#8212; Measuring Lives, 21-Year Windows &amp; Vesting Events</text>
  <text class="small" x="36" y="766">Death years are illustrative, drawn only to show how the perpetuity period is built (last life in being + 21 yrs).</text>

  <!-- beyond-period shading (x of 2116 = 904 to right edge) -->
  <rect class="beyond" x="904" y="784" width="396" height="300"/>

  <!-- axis -->
  <line class="axis" x1="150" y1="800" x2="1300" y2="800"/>
  <!-- ticks: 2024(150) 2050(363) 2075(568) 2100(773) 2125(978) 2150(1183) -->
  <g text-anchor="middle">
    <line class="tick" x1="150" y1="795" x2="150" y2="1066"/>
    <text class="tiny" x="150" y="789">2024</text>
    <line class="tick" x1="363" y1="795" x2="363" y2="1066"/>
    <text class="tiny" x="363" y="789">2050</text>
    <line class="tick" x1="568" y1="795" x2="568" y2="805"/>
    <text class="tiny" x="568" y="789">2075</text>
    <line class="tick" x1="773" y1="795" x2="773" y2="805"/>
    <text class="tiny" x="773" y="789">2100</text>
    <line class="tick" x1="978" y1="795" x2="978" y2="805"/>
    <text class="tiny" x="978" y="789">2125</text>
    <line class="tick" x1="1183" y1="795" x2="1183" y2="1066"/>
    <text class="tiny" x="1183" y="789">2150</text>
  </g>

  <!-- measuring life rows: bracket = [death, death+21] -->
  <!-- Octavia: d~2040 (281) -> 2061 (453) -->
  <g>
    <circle class="deathdot" cx="281" cy="828" r="4.5"/>
    <line class="window" x1="281" y1="828" x2="453" y2="828"/>
    <line class="windowcap" x1="281" y1="821" x2="281" y2="835"/>
    <line class="windowcap" x1="453" y1="821" x2="453" y2="835"/>
    <text class="winlbl" x="275" y="824" text-anchor="end">Octavia (82) &#8212; stranger to the gift</text>
    <text class="tiny" x="461" y="832">+21</text>
  </g>
  <!-- Arthur: d~2050 (363) -> 2071 (535) -->
  <g>
    <circle class="deathdot" cx="363" cy="858" r="4.5"/>
    <line class="window" x1="363" y1="858" x2="535" y2="858"/>
    <line class="windowcap" x1="363" y1="851" x2="363" y2="865"/>
    <line class="windowcap" x1="535" y1="851" x2="535" y2="865"/>
    <text class="winlbl" x="357" y="854" text-anchor="end">Arthur (52)</text>
    <text class="tiny" x="543" y="862">+21</text>
  </g>
  <!-- Bernice: d~2055 (404) -> 2076 (576) -->
  <g>
    <circle class="deathdot" cx="404" cy="888" r="4.5"/>
    <line class="window" x1="404" y1="888" x2="576" y2="888"/>
    <line class="windowcap" x1="404" y1="881" x2="404" y2="895"/>
    <line class="windowcap" x1="576" y1="881" x2="576" y2="895"/>
    <text class="winlbl" x="398" y="884" text-anchor="end">Bernice (49)</text>
    <text class="tiny" x="584" y="892">+21</text>
  </g>
  <!-- Celia: d~2090 (691) -> 2111 (863) -->
  <g>
    <circle class="deathdot" cx="691" cy="918" r="4.5"/>
    <line class="window" x1="691" y1="918" x2="863" y2="918"/>
    <line class="windowcap" x1="691" y1="911" x2="691" y2="925"/>
    <line class="windowcap" x1="863" y1="911" x2="863" y2="925"/>
    <text class="winlbl" x="685" y="914" text-anchor="end">Celia (24)</text>
    <text class="tiny" x="871" y="922">+21</text>
  </g>
  <!-- Dmitri: d~2095 (732) -> 2116 (904) = last survivor -->
  <g>
    <circle class="deathdot" cx="732" cy="948" r="4.5"/>
    <line class="window" x1="732" y1="948" x2="904" y2="948"/>
    <line class="windowcap" x1="732" y1="941" x2="732" y2="955"/>
    <line class="windowcap" x1="904" y1="941" x2="904" y2="955"/>
    <text class="winlbl" x="726" y="944" text-anchor="end">Dmitri (19) &#8212; last survivor</text>
    <text class="tiny" x="912" y="952">+21</text>
  </g>

  <!-- perpetuity boundary at 2116 (x=904) -->
  <line class="boundary" x1="904" y1="800" x2="904" y2="1066"/>
  <text class="voidtxt" x="912" y="978" font-weight="700">End of perpetuity period</text>
  <text class="voidtxt" x="912" y="995">(last life + 21 yrs &#8776; 2116)</text>
  <text class="voidtxt" x="912" y="1012">Region at right is beyond the Rule.</text>

  <!-- vesting events track -->
  <text class="vestlbl" x="150" y="1045" font-weight="700" fill="#5b21b6">Vesting events:</text>
  <!-- widow ascertained / scenario i failure @2050 (363) -->
  <path class="vest" d="M 363 1054 l 7 8 l -7 8 l -7 -8 z"/>
  <text class="vestlbl" x="356" y="1086" text-anchor="middle">Arthur dies (~2050):</text>
  <text class="vestlbl" x="356" y="1101" text-anchor="middle">widow ascertained</text>
  <!-- grandchild attains 25, unbounded -->
  <path class="vest" d="M 470 1054 l 7 8 l -7 8 l -7 -8 z"/>
  <line x1="470" y1="1062" x2="1140" y2="1062" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#purplearrow)"/>
  <text class="vestlbl" x="478" y="1048">grandchild attains 25 &#8212; may occur at ANY time (unbounded &#8594;)</text>

  <!-- scenario i marker @2050 -->
  <line x1="363" y1="800" x2="363" y2="784" stroke="#15803d" stroke-width="2"/>
  <text x="363" y="778" text-anchor="middle" font-size="11.5px" fill="#15803d" font-weight="700">Scenario (i): line fails 2050 &#8212; within period</text>

  <!-- scenario ii failure @2150 (1183) -->
  <path class="vest" d="M 1183 1054 l 7 8 l -7 8 l -7 -8 z" fill="#b91c1c"/>
  <line x1="1183" y1="800" x2="1183" y2="784" stroke="#b91c1c" stroke-width="2"/>
  <text x="1183" y="778" text-anchor="middle" font-size="11.5px" fill="#b91c1c" font-weight="700">Scenario (ii): line fails 2150 &#8212; beyond period</text>
  <text class="vestlbl" x="1190" y="1086" text-anchor="end" fill="#b91c1c">would be VOID under RAP;</text>
  <text class="vestlbl" x="1190" y="1101" text-anchor="end" fill="#b91c1c">valid only via fee-tail exemption</text>

  <!-- ================= SECTION C: LEGEND ================= -->
  <text class="sec" x="36" y="1158">C.  Legend</text>
  <rect class="legbox" x="36" y="1172" width="1328" height="224" rx="8"/>

  <!-- col 1 -->
  <rect class="present" x="60" y="1192" width="40" height="26" rx="4"/>
  <text class="small" x="112" y="1210">Present possessory estate (fee tail)</text>

  <rect class="valid" x="60" y="1228" width="40" height="26" rx="4"/>
  <text class="small" x="112" y="1246">Valid future interest (as held)</text>

  <rect class="void" x="60" y="1264" width="40" height="26" rx="4"/>
  <text class="small" x="112" y="1282">Void under classical RAP</text>

  <rect class="revbox" x="60" y="1300" width="40" height="26" rx="4"/>
  <text class="small" x="112" y="1318">Reversion (backstop)</text>

  <rect class="tealbox" x="60" y="1336" width="40" height="26" rx="4"/>
  <text class="small" x="112" y="1354">Fee-tail exemption (rescues void interests)</text>

  <!-- col 2 -->
  <circle class="deathdot" cx="490" cy="1205" r="5"/>
  <line class="window" x1="490" y1="1205" x2="560" y2="1205"/>
  <line class="windowcap" x1="490" y1="1199" x2="490" y2="1211"/>
  <line class="windowcap" x1="560" y1="1199" x2="560" y2="1211"/>
  <text class="small" x="576" y="1210">Measuring life: death (dot) + 21-yr RAP window</text>

  <path class="vest" d="M 510 1235 l 7 8 l -7 8 l -7 -8 z"/>
  <text class="small" x="576" y="1246">Vesting event</text>

  <line class="boundary" x1="490" y1="1268" x2="530" y2="1268"/>
  <text class="small" x="576" y="1282">End of perpetuity period (last life + 21)</text>

  <rect class="beyond" x="490" y="1300" width="40" height="20"/>
  <text class="small" x="576" y="1318">Time beyond the Rule&#8217;s reach</text>

  <text class="small" x="490" y="1354">CR = contingent remainder &#183; LE = life estate &#183; FT = fee tail</text>

  <!-- col 3 -->
  <text class="boxttl" x="940" y="1200" font-size="14px">Bottom line</text>
  <text class="small" x="940" y="1222">Franklin retains the fee tail, so every</text>
  <text class="small" x="940" y="1240">remainder after it escapes the Rule.</text>
  <text class="small" x="940" y="1258">All interests are VALID &#8212; but all remain</text>
  <text class="small" x="940" y="1276">destructible if Arthur bars the entail.</text>
  <text class="small" x="940" y="1300">Bernice is not yet the &#8220;widow&#8221; (fixed only</text>
  <text class="small" x="940" y="1318">at Arthur&#8217;s death). Octavia is a stranger to</text>
  <text class="small" x="940" y="1336">the gift: the conclusive fertility presumption</text>
  <text class="small" x="940" y="1354">applies to no interest and changes nothing.</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="tealarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="purplearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>
</svg>
