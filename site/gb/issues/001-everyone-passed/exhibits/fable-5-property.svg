  <rect x="0" y="0" width="1280" height="1440" fill="#ffffff"/>

  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">IN RE ESTATE OF HELENA CARTWRIGHT &#8212; ARTICLE IV: BLACKACRE</text>
  <text x="640" y="64" text-anchor="middle" font-size="13" fill="#475569">Chain of interests and common-law Rule Against Perpetuities analysis &#8212; State of Franklin (fee tail retained; classical Rule; no wait-and-see)</text>

  <text x="40" y="108" font-size="16" font-weight="bold" fill="#0f172a">1 &#8212; CHAIN OF INTERESTS CREATED AT HELENA&#8217;S DEATH (MARCH 1, 2024)</text>

  <g>
    <rect x="40" y="150" width="210" height="110" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="52" y="178" font-size="13" font-weight="bold" fill="#0f172a">HELENA CARTWRIGHT</text>
    <text x="52" y="196" font-size="11" fill="#334155">Testatrix &#8212; fee simple absolute</text>
    <text x="52" y="212" font-size="11" fill="#334155">d. Mar 1, 2024 &#8212; will speaks;</text>
    <text x="52" y="227" font-size="11" fill="#334155">perpetuities period begins</text>
  </g>

  <g>
    <rect x="310" y="150" width="200" height="110" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="446" y="158" width="54" height="18" rx="9" fill="#0f766e"/>
    <text x="473" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">VALID</text>
    <text x="322" y="180" font-size="14" font-weight="bold" fill="#0f172a">ARTHUR</text>
    <text x="322" y="198" font-size="11" fill="#134e4a">Fee tail general (possessory)</text>
    <text x="322" y="214" font-size="10.5" font-style="italic" fill="#334155">&#8220;and the heirs of his body&#8221;</text>
    <text x="322" y="230" font-size="10" fill="#475569">present estate &#8212; Rule inapplicable</text>
  </g>

  <g>
    <rect x="570" y="150" width="250" height="110" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="756" y="158" width="54" height="18" rx="9" fill="#0f766e"/>
    <text x="783" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">VALID</text>
    <text x="582" y="180" font-size="13" font-weight="bold" fill="#0f172a">ARTHUR&#8217;S WIDOW</text>
    <text x="582" y="198" font-size="11" fill="#134e4a">Contingent remainder &#8212; LIFE ESTATE</text>
    <text x="582" y="214" font-size="10.5" fill="#334155">taker unascertained until Arthur&#8217;s death</text>
    <text x="582" y="230" font-size="10" fill="#475569">vests, if at all, at Arthur&#8217;s death (Bernice TBD)</text>
  </g>

  <g>
    <rect x="880" y="130" width="360" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7,4"/>
    <rect x="1146" y="138" width="84" height="18" rx="9" fill="#b91c1c"/>
    <text x="1188" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">VOID (RAP)</text>
    <text x="892" y="160" font-size="13" font-weight="bold" fill="#7f1d1d">GRANDCHILDREN WHO ATTAIN 25</text>
    <line x1="892" y1="156" x2="1115" y2="156" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="892" y="178" font-size="11" fill="#7f1d1d">Contingent remainder in fee simple (open class)</text>
    <text x="892" y="194" font-size="10.5" fill="#7f1d1d">no validating life; age 25 &gt; 21; all-or-nothing class rule</text>
    <text x="892" y="210" font-size="10" fill="#991b1b">void ab initio &#8212; stricken as of Mar 1, 2024</text>
  </g>

  <g>
    <rect x="880" y="280" width="360" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7,4"/>
    <rect x="1146" y="288" width="84" height="18" rx="9" fill="#b91c1c"/>
    <text x="1188" y="301" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">VOID (RAP)</text>
    <text x="892" y="310" font-size="13" font-weight="bold" fill="#7f1d1d">RENSSELAER HISTORICAL SOCIETY</text>
    <line x1="892" y1="306" x2="1124" y2="306" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="892" y="328" font-size="11" fill="#7f1d1d">Alternative contingent remainder in fee simple</text>
    <text x="892" y="344" font-size="10.5" fill="#7f1d1d">vests only on indefinite failure of the bodily line</text>
    <text x="892" y="360" font-size="10" fill="#991b1b">charity-to-charity exception N/A (prior takers private)</text>
  </g>

  <g>
    <rect x="310" y="300" width="280" height="100" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="526" y="308" width="54" height="18" rx="9" fill="#0f766e"/>
    <text x="553" y="321" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">VALID</text>
    <text x="322" y="330" font-size="13" font-weight="bold" fill="#0f172a">REVERSION IN FEE SIMPLE</text>
    <text x="322" y="348" font-size="11" fill="#134e4a">retained by Helena&#8217;s estate;</text>
    <text x="322" y="363" font-size="11" fill="#134e4a">passes to ARTHUR under the residue</text>
    <text x="322" y="379" font-size="10" fill="#475569">vested at creation &#8212; Rule never applies</text>
  </g>

