  <g font-size="10.5" font-weight="bold" fill="#1e293b">
    <circle cx="277" cy="192" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="277" y="196" text-anchor="middle">1</text>
    <circle cx="537" cy="192" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="537" y="196" text-anchor="middle">2</text>
    <circle cx="847" cy="172" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="847" y="176" text-anchor="middle">3</text>
    <circle cx="847" cy="280" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="847" y="284" text-anchor="middle">4</text>
    <circle cx="145" cy="300" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="145" y="304" text-anchor="middle">5</text>
    <circle cx="620" cy="400" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="620" y="404" text-anchor="middle">6</text>
  </g>

  <g>
    <rect x="640" y="420" width="600" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="654" y="444" font-size="11" font-weight="bold" fill="#7c2d12">TITLE AFTER STRIKING THE VOID GIFTS &#8212; Arthur: fee tail (possessory) + reversion in fee simple;</text>
    <text x="654" y="462" font-size="11" fill="#7c2d12">widow (unascertained): valid contingent remainder for life. No merger: an entail never merges into the fee.</text>
  </g>

  <g font-size="11" fill="#334155">
    <text x="40" y="512"><tspan font-weight="bold">1</tspan>  Devise of Blackacre under Article IV, effective at Helena&#8217;s death.</text>
    <text x="40" y="529"><tspan font-weight="bold">2</tspan>  Entail expires on INDEFINITE failure of Arthur&#8217;s bodily line; &#8220;widow&#8221; is ascertained only at Arthur&#8217;s death (unborn-widow rule &#8212; Bernice cannot be identified in 2024).</text>
    <text x="40" y="546"><tspan font-weight="bold">3</tspan>  &#8220;Then&#8221; to grandchildren who attain 25 &#8212; condition precedent; open class; all-or-nothing rule; rule of convenience cannot close the class within the period.</text>
    <text x="40" y="563"><tspan font-weight="bold">4</tspan>  &#8220;But if&#8221; no grandchild attains 25 &#8212; alternative contingent remainder, contingent on an event untethered to any life in being.</text>
    <text x="40" y="580"><tspan font-weight="bold">5</tspan>  Residuary clause carries Helena&#8217;s retained reversion to Arthur (vested; categorically exempt from the Rule).</text>
    <text x="40" y="597"><tspan font-weight="bold">6</tspan>  With 3 and 4 stricken: on failure of the line, possession passes to the widow for life (if then living), then to the reversion in fee simple absolute.</text>
  </g>

  <text x="40" y="648" font-size="16" font-weight="bold" fill="#0f172a">2 &#8212; MEASURING LIVES, 21-YEAR WINDOWS, AND VESTING EVENTS</text>
  <text x="40" y="666" font-size="11" font-style="italic" fill="#64748b">Death dates are illustrative. The classical Rule judges validity at creation (Mar 1, 2024) by what MIGHT happen, however improbable.</text>

  <rect x="639.5" y="676" width="590.5" height="344" fill="#fecaca" opacity="0.25"/>
  <line x1="639.5" y1="676" x2="639.5" y2="1132" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="648" y="700" font-size="12" font-weight="bold" fill="#b91c1c">PERPETUITIES HORIZON &#8212; 2087</text>
  <text x="648" y="714" font-size="10" fill="#b91c1c">last life in being (Dmitri &#8224;2066) + 21 yrs (illustrative)</text>

  <g font-size="12" fill="#0f172a">
    <text x="24" y="734" font-weight="bold">Octavia (82)</text>
    <text x="24" y="779" font-weight="bold">Arthur (52)</text>
    <text x="24" y="824" font-weight="bold">Bernice (49)</text>
    <text x="24" y="869" font-weight="bold">Celia (24)</text>
    <text x="24" y="914" font-weight="bold">Dmitri (19)</text>
    <text x="24" y="934" font-size="10" fill="#64748b">after-born:</text>
    <text x="24" y="948" font-weight="bold" font-size="11" fill="#64748b">E (b. 2025)</text>
    <text x="24" y="993" font-weight="bold" font-size="11" fill="#64748b">G (b. 2070)</text>
  </g>

  <g>
    <rect x="130" y="725" width="64.7" height="10" rx="3" fill="#0f766e"/>
    <text x="194.7" y="720" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">&#8224;2032</text>
    <path d="M194.7,740 v7 h169.8 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="279.6" y="760" text-anchor="middle" font-size="9.5" fill="#92400e">+21 &#8594; 2053</text>
    <text x="380" y="734" font-size="9.5" font-style="italic" fill="#64748b">conclusively presumed fertile at 82 (Jee v. Audley) &#8212; but immaterial: neither taker nor ancestor of a taker</text>
  </g>

  <g>
    <rect x="130" y="770" width="161.8" height="10" rx="3" fill="#0f766e"/>
    <text x="291.8" y="765" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">&#8224;2044</text>
    <path d="M291.8,785 v7 h169.8 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="376.7" y="805" text-anchor="middle" font-size="9.5" fill="#92400e">+21 &#8594; 2065</text>
    <text x="480" y="779" font-size="9.5" font-style="italic" fill="#15803d">validating life for the widow&#8217;s remainder: it vests or fails the instant he dies</text>
  </g>

  <g>
    <rect x="130" y="815" width="202.2" height="10" rx="3" fill="#0f766e"/>
    <text x="332.2" y="810" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">&#8224;2049</text>
    <path d="M332.2,830 v7 h169.8 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="417.1" y="850" text-anchor="middle" font-size="9.5" fill="#92400e">+21 &#8594; 2070</text>
    <text x="520" y="824" font-size="9.5" font-style="italic" fill="#64748b">presumed fertile at 49; may predecease or divorce &#8212; the actual &#8220;widow&#8221; may be unborn in 2024</text>
  </g>

  <g>
    <rect x="130" y="860" width="275" height="10" rx="3" fill="#0f766e"/>
    <text x="405" y="855" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">&#8224;2058</text>
    <path d="M405,875 v7 h169.8 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="489.9" y="895" text-anchor="middle" font-size="9.5" fill="#92400e">+21 &#8594; 2079</text>
  </g>

  <g>
    <rect x="130" y="905" width="339.7" height="10" rx="3" fill="#0f766e"/>
    <text x="469.7" y="900" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">&#8224;2066</text>
    <path d="M469.7,920 v7 h169.8 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="554.6" y="940" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400e">+21 &#8594; 2087 = HORIZON</text>
  </g>

  <g>
    <line x1="138.1" y1="944" x2="785.1" y2="944" stroke="#94a3b8" stroke-width="7" stroke-dasharray="10,6" opacity="0.6"/>
    <circle cx="138.1" cy="944" r="4" fill="#475569"/>
    <text x="785.1" y="938" text-anchor="middle" font-size="10" fill="#64748b" font-weight="bold">&#8224;2105</text>
    <text x="190" y="962" font-size="9.5" font-style="italic" fill="#475569">E &#8212; after-born child of Arthur (Arthur presumed fertile at 52): NOT a life in being</text>
  </g>

  <g>
    <line x1="502.1" y1="989" x2="1149.1" y2="989" stroke="#94a3b8" stroke-width="7" stroke-dasharray="10,6" opacity="0.6"/>
    <circle cx="502.1" cy="989" r="4" fill="#475569"/>
    <text x="502.1" y="1006" text-anchor="middle" font-size="9" fill="#64748b">b. 2070</text>
    <text x="540" y="977" font-size="9.5" font-style="italic" fill="#475569">G &#8212; child of E, grandchild of Arthur</text>
    <circle cx="704.3" cy="989" r="4.5" fill="#b91c1c"/>
    <text x="714" y="1006" font-size="9.5" font-weight="bold" fill="#b91c1c">attains 25 &#8594; 2095</text>
    <text x="1149.1" y="977" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">&#8224;2150 &#8212; line fails</text>
  </g>

