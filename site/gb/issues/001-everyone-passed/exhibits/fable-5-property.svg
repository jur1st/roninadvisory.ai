    <rect x="60" y="1304" width="34" height="16" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="64" y1="1312" x2="90" y2="1312" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="106" y="1316">Void under the Rule &#8212; dashed border, struck-through title; stricken from the devise</text>
    <rect x="60" y="1334" width="30" height="8" rx="2" fill="#0f766e"/>
    <text x="96" y="1343" font-weight="bold" fill="#7f1d1d">&#8224;</text>
    <text x="106" y="1344">Measuring life in being on Mar 1, 2024; &#8224; = death (dates illustrative)</text>
    <line x1="60" y1="1366" x2="92" y2="1366" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8,5" opacity="0.6"/>
    <text x="106" y="1370">Person NOT in being at creation (conceived after Mar 1, 2024)</text>

    <path d="M662,1278 v7 h40 v-7" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="716" y="1288">21-year perpetuities window running from each measuring life&#8217;s death</text>
    <line x1="682" y1="1300" x2="682" y2="1318" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="690" y="1303" width="14" height="12" fill="#fecaca" opacity="0.5"/>
    <text x="716" y="1316">Perpetuities horizon = last life in being + 21 yrs; shaded zone = beyond the period</text>
    <path d="M682,1332 L675,1344 L689,1344 z" fill="#15803d"/>
    <text x="716" y="1344">Vesting event within the period &#8594; interest VALID</text>
    <path d="M668,1360 L661,1372 L675,1372 z" fill="#b91c1c"/>
    <path d="M696,1359 l6,6 l-6,6 l-6,-6 z" fill="#1d4ed8"/>
    <text x="716" y="1370">Vesting beyond the period &#8594; VOID; blue diamond = Question 3 possession hypothetical</text>
  </g>

  <text x="40" y="1414" font-size="10.5" font-style="italic" fill="#64748b">Companion to answer.md. The E/G line and all death dates illustrate what MIGHT happen as viewed from March 1, 2024: the classical Rule voids an interest if ANY possible chain of events defers vesting beyond every life in being plus 21 years.</text>
</svg>
