  <text x="130" y="1066" font-size="11.5" font-weight="bold" fill="#15803d">VESTING EVENT 2044 &#8212; Arthur dies: widow ascertained; her life-estate remainder VESTS at Arthur + 0 years &#8594; VALID</text>
  <text x="400" y="1088" font-size="11.5" font-weight="bold" fill="#b91c1c">VESTING EVENT 2095 &#8212; G attains 25: first possible vesting of the class gift, 29 yrs after the last life in being &#8594; VOID</text>
  <text x="1230" y="1110" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b91c1c">VESTING EVENT 2150 &#8212; bodily line fails (G dies without issue): only now could the Society&#8217;s gift vest &#8594; VOID</text>

  <text x="40" y="1152" font-size="13" font-weight="bold" fill="#0f172a">QUESTION 3 &#8212; WHO TAKES IN POSSESSION? (each hypothetical on its own assumed facts; possession, not vesting)</text>
  <line x1="130" y1="1180" x2="1230" y2="1180" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340.3" y="1170" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">2050</text>
  <path d="M340.3,1173 l7,7 l-7,7 l-7,-7 z" fill="#1d4ed8"/>
  <text x="1149.1" y="1170" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">2150</text>
  <path d="M1149.1,1173 l7,7 l-7,7 l-7,-7 z" fill="#1d4ed8"/>
  <text x="130" y="1206" font-size="11" fill="#1e3a8a">(i) Line fails 2050 &#8594; Arthur&#8217;s widow, if then living, takes her life estate in possession; then the holders of Arthur&#8217;s reversion take in fee simple absolute.</text>
  <text x="130" y="1224" font-size="11" fill="#1e3a8a">(ii) Line fails 2150 &#8594; the then-holders of the reversion take in fee simple absolute. The Society and the grandchildren take NOTHING in either case.</text>

  <text x="40" y="1262" font-size="14" font-weight="bold" fill="#0f172a">LEGEND</text>
  <g font-size="10.5" fill="#334155">
    <rect x="60" y="1276" width="34" height="16" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
